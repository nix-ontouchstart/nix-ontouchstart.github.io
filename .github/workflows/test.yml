# https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
name: test

on: push

jobs:
  test:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v7
    - name: Platform
      run: uname -a
    - name: install nix from https://github.com/DeterminateSystems/nix-installer/releases/download/v3.23.3/nix-installer.sh
      run: cat nix-installer.sh | sh -s -- install --no-confirm
    - name: nix version
      run: nix --version
    - name: nix flake show github:nix-ontouchstart/nix-ontouchstart/aarch64-darwin
      run: nix flake show github:nix-ontouchstart/nix-ontouchstart/aarch64-darwin
    - name: nix run
      run: nix run 
