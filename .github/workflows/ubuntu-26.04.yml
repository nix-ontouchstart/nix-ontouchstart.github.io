# https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2604-Readme.md

name: ubuntu-26.04

on: push

jobs:
  build:

    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v6
    - name: Platform
      run: uname -a
    - name: install.determinate.system/nix
      run: curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --no-confirm 
    - name: nix version
      run: nix --version
